[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crashpulse-backend"
version = "0.1.0"
description = "Local PostgreSQL-backed CrashPulse API"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "firebase-admin>=6.6,<8",
  "jsonschema>=4.23,<5",
  "PyJWT>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/admin/*.html", "static/admin/assets/*.css", "static/admin/assets/*.js"]
scripts = ["migrations/*.sql"]
